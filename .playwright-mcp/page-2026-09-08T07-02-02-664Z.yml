              - paragraph [ref=e91]: "[CERTAIN] channelRef.compareAndSet(old, new) at L120 is not retried on failure — if two threads both see old==null, only one CAS succeeds and the other silently skips migration. Between reading the old value and calling compareAndSet, the reference could change A→B→A (ABA): a reconnect that swaps the channel away and back would make the CAS succeed incorrectly. Suggest using AtomicStampedReference or a monotonic generation counter."
