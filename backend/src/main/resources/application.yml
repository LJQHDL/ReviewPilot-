server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: reviewpilot-backend

logging:
  level:
    root: INFO
    com.reviewpilot: DEBUG

reviewpilot:
  web:
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  prompt:
    budget:
      # Per-file patch character cap (~1.5k tokens at 4 chars/token).
      max-patch-chars-per-file: 6000
      # Total prompt character cap (~16k tokens). Leave room for system prompt
      # + model output (max-tokens below). Bump for very long PRs.
      max-total-chars: 60000
  github:
    api-base: https://api.github.com
    token: ${GITHUB_TOKEN:}
  ai:
    provider: deepseek
    deepseek:
      api-base: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      timeout: 60s
      max-tokens: 4096
      temperature: 0.2
    agent:
      reflection:
        # Toggle the Critic → Revision loop. When false, /api/review runs a
        # single LLM pass (V1 behaviour). Enable for demos that show the
        # quality-improvement loop; disable for low-latency daily use.
        enabled: true
        # Maximum revision attempts (currently fixed at 1 — multi-round is V3).
        # max-rounds: 2
      content-fetcher:
        enabled: true
      react:
        # ReAct agent loop: max LLM turns (including tool calls) before forced
        # completion. Lower values reduce latency; raise for complex multi-file PRs.
        max-rounds: 8
        # Rough character limit for the entire conversation context (system prompt +
        # user prompt + tool call results + LLM responses). When exceeded, early
        # tool results are truncated. Characters / 4 ≈ token estimate.
        max-total-chars: 64000
