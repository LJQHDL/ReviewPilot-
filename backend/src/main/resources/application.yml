server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: reviewpilot-backend

logging:
  level:
    root: INFO
    com.reviewpilot: DEBUG

reviewpilot:
  web:
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  github:
    api-base: https://api.github.com
    token: ${GITHUB_TOKEN:}
  ai:
    provider: deepseek
    deepseek:
      api-base: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      timeout: 60s
      max-tokens: 4096
      temperature: 0.2
