server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: reviewpilot-backend

logging:
  level:
    root: INFO
    com.reviewpilot: DEBUG
  pattern:
    # 每个 API 请求的 requestId 由 ApiSecurityFilter 写入 MDC，随所有日志输出，
    # 便于把脱敏后的 5xx 与具体请求关联起来。
    level: "%5p [%X{requestId:-}]"

reviewpilot:
  security:
    enabled: ${REVIEWPILOT_SECURITY_ENABLED:false}
    access-token: ${REVIEWPILOT_ACCESS_TOKEN:}
    reviews-per-minute: 10
    max-concurrent-reviews: 2
  web:
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  prompt:
    budget:
      # Per-file patch character cap (~1.5k tokens at 4 chars/token).
      max-patch-chars-per-file: 6000
      # Total prompt character cap (~16k tokens). Leave room for system prompt
      # + model output (max-tokens below). Bump for very long PRs.
      max-total-chars: 60000
  github:
    api-base: https://api.github.com
    token: ${GITHUB_TOKEN:}
    # Repositories this service will read with its own token, as owner/repo with *
    # allowed (e.g. [octocat/Hello-World, my-org/*]). Empty means any repository a
    # caller names — fine on localhost, not fine for a private-repo token on a host
    # callers can reach.
    allowed-repos: ${REVIEWPILOT_ALLOWED_REPOS:}
    # Ceiling for a single GitHub HTTP call. Every GitHub call blocks a servlet
    # thread, so this is what stops one stalled connection pinning a worker forever.
    timeout: 10s
    # Pages of /pulls/{n}/files to walk (100 files each). Beyond this the review is
    # reported as truncated instead of silently partial.
    max-file-pages: 3
  ai:
    # 生效端点名。省略时若只声明一个端点则自动生效；声明多个则必须显式指定，否则启动失败。
    active: deepseek
    # 多套具名端点。全部走 OpenAI 兼容协议（/v1/chat/completions），换厂商=加一段+改 active，零代码。
    # 密钥只从环境变量注入（${ENV:} 占位），切勿把明文 key 提交进本文件。
    # 各家 timeout/max-tokens/temperature/max-retries 可省略，省略则用默认（60s/4096/0.2/1）。
    endpoints:
      deepseek:
        api-base: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        timeout: 60s
        max-tokens: 4096
        temperature: 0.2
        # Transient network errors only; HTTP 4xx/5xx are never retried.
        max-retries: 1
      # 示例：再加一家 OpenAI 兼容厂商（改 active: openai 即切换）。密钥用各自环境变量。
      # openai:
      #   api-base: https://api.openai.com
      #   api-key: ${OPENAI_API_KEY:}
      #   model: gpt-4o-mini
      # kimi:
      #   api-base: https://api.moonshot.cn
      #   api-key: ${KIMI_API_KEY:}
      #   model: moonshot-v1-8k
  # These keys must sit directly under `reviewpilot` — the @Value expressions read
  # `reviewpilot.agent.*`. Nesting them under `ai:` makes them silently inert, which
  # is exactly how reflection.enabled=false stopped working once.
  agent:
    # Whole-request wall-clock budget. Bounds how many further model round-trips may
    # START (checked per ReAct round, per tool call, and before reflection); it does
    # NOT cap elapsed time, because an in-flight call runs to its own timeout.
    request-budget-ms: 45000
    reflection:
      # Toggle the Critic → Revision loop. When false, /api/review runs a
      # single LLM pass (V1 behaviour). Enable for demos that show the
      # quality-improvement loop; disable for low-latency daily use.
      enabled: true
      # Maximum revision attempts (currently fixed at 1 — multi-round is V3).
      # max-rounds: 2
    content-fetcher:
      enabled: true
      # How many risky files get a full-file prefetch (each costs GitHub calls).
      # Was uncapped: a PR with 300 flagged files issued 300 extra fetches.
      max-prefetch-files: 5
    tools:
      # Search budget per repository per minute. Per repo on purpose: a process-wide
      # counter let one busy PR starve every other review of search_repo.
      search-limit-per-minute: 25
      # Search results held at once; least used are evicted.
      search-cache-entries: 256
    react:
      # ReAct agent loop: max LLM turns (including tool calls) before forced
      # completion. Lower values reduce latency; raise for complex multi-file PRs.
      max-rounds: 8
      # Rough character limit for the entire conversation context (system prompt +
      # user prompt + tool call results + LLM responses). When exceeded, early
      # tool results are truncated. Characters / 4 ≈ token estimate.
      max-total-chars: 64000
